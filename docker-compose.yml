services:
  postgres:
    image: postgres:16-alpine
    container_name: jeevan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jeevan
      POSTGRES_USER: jeevan
      POSTGRES_PASSWORD: jeevan
    ports:
      - "5432:5432"
    volumes:
      - jeevan_pgdata:/var/lib/postgresql/data

volumes:
  jeevan_pgdata:
